name: WNBA Live Play By Play

on:
  schedule:
    # Hourly check-in instead of 3 big blind ~4.5h windows. Each firing runs
    # wnba_playbyplay_gate.py first, which looks at TODAY's real game times
    # (not a guessed clock window) and decides whether there's anything
    # worth polling for right now; the actual poll loop below only runs
    # when the gate says yes. This also shrinks the blast radius of a
    # missed firing -- GitHub's `schedule` trigger is best-effort and on
    # 2026-08-26 silently skipped one of the old 3 windows entirely,
    # leaving the tracker dead for 5+ hours during that night's games.
    # A missed hourly firing now only costs about an hour, not half a night.
    #
    # Two entries, not one: `schedule` delivery is the single least reliable
    # part of this system (see wnba_playbyplay_selfchain.py), so this takes
    # two chances an hour rather than one. Any firing that lands while a run
    # is already going is harmlessly dropped by the concurrency group below.
    - cron: "0 * * * *"
    - cron: "30 * * * *"
  workflow_dispatch: {}

concurrency:
  # Never let two of these loops write to the shared Google Sheet at the
  # same time -- the script does a full clear()+rewrite of the Play By
  # Play tab, so an overlapping run could wipe out the other's writes.
  # Queue (don't cancel) so a later firing just waits its turn instead of
  # losing the run outright.
  group: live-pbp
  cancel-in-progress: false

jobs:
  live-pbp:
    runs-on: ubuntu-latest
    # Comfortably above the ~265-minute loop below, well under GitHub's
    # 360-minute hard cap for hosted runners.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check whether a game is relevant right now
        id: gate
        run: python wnba_playbyplay_gate.py
        continue-on-error: true

      - name: Write Google service account credentials
        if: steps.gate.outcome == 'success'
        run: printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$RUNNER_TEMP/gcreds.json"
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Capture live first-4-minutes play by play (polls every 5 min, up to ~4.4h)
        if: steps.gate.outcome == 'success'
        env:
          GOOGLE_CREDENTIALS_PATH: ${{ runner.temp }}/gcreds.json
          MAIN_PIPELINE_DISPATCH_TOKEN: ${{ secrets.MAIN_PIPELINE_DISPATCH_TOKEN }}
        run: |
          # ~265 minutes is a ceiling, not a target. The loop normally ends
          # earlier, when the gate says the slate is over -- see below.
          END=$((SECONDS + 15900))
          while true; do
            python wnba_playbyplay_live.py
            if [ "$SECONDS" -ge "$END" ]; then
              echo "Hit the ~265-minute ceiling -- exiting; the next hourly firing takes over."
              break
            fi
            sleep 300
            # Re-check relevance between cycles. Without this the job holds
            # the `live-pbp` concurrency group for the full ceiling even once
            # every game has finished, which blocks the next ~4 hourly
            # firings and defeats the point of checking in hourly at all.
            if ! python wnba_playbyplay_gate.py; then
              echo "Nothing relevant left today -- exiting early to free the concurrency group."
              break
            fi
          done

      # The poll loop above is capped at ~265 minutes. If it hit that cap
      # while games were still on, nothing would restart it until the next
      # `schedule` firing lands -- and those are precisely what this repo
      # cannot count on. Hand off to a fresh run instead, so one delivered
      # event sustains coverage for the whole slate. No-ops when the slate
      # is over or no token is configured.
      - name: Hand off to a fresh run if games are still live
        if: steps.gate.outcome == 'success'
        env:
          SELF_DISPATCH_TOKEN: ${{ secrets.SELF_DISPATCH_TOKEN }}
          MAIN_PIPELINE_DISPATCH_TOKEN: ${{ secrets.MAIN_PIPELINE_DISPATCH_TOKEN }}
        run: python wnba_playbyplay_selfchain.py
